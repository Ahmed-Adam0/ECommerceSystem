<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #4e73df, #1cc88a);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    display: flex;
    justify-content: center;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #4e73df;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #2e59d9;
}

.link {
    margin-top: 15px;
}
.popup {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 15px;
    color: #fff;
    z-index: 9999;
    animation: fadeIn 0.3s ease;
}

.popup.success {
    background: #1cc88a;
}

.popup.error {
    background: #e74a3b;
}

.hidden {
    display: none;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translate(-50%, -10px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Welcome Back</h2>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p class="link">
            Don't have an account?
            <a href="#" onclick="openRegister()">Register</a>
        </p>
    </div>
</div>
<div id="popup" class="popup hidden">
    <span id="popup-message"></span>
</div>
<script>
function login() {
    const data = {
        action: "login",
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    window.chrome.webview.postMessage(data);
}
function showPopup(message, type) {
    const popup = document.getElementById("popup");
    const text = document.getElementById("popup-message");

    text.innerText = message;
    popup.className = `popup ${type}`;

    popup.classList.remove("hidden");

    setTimeout(() => {
        popup.classList.add("hidden");
    }, 2000);
}

window.chrome.webview.addEventListener("message", event => {
    const msg = typeof event.data === "string"
        ? JSON.parse(event.data)
        : event.data;

    if (!msg.action) return;

    if (msg.action === "loginSuccess") {
        showPopup(msg.message, "success");
    }

    if (msg.action === "loginError") {
        showPopup(msg.message, "error");
    }
});
function openRegister() {
    window.chrome.webview.postMessage({
        action: "openRegister"
    });
}
</script>

</body>
</html>
