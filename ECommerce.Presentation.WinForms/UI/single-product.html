<script>
let currentImages = [];

/* ===============================
   Receive Product From C#
=================================*/
window.chrome.webview.addEventListener('message', event => {

    const payload = typeof event.data === "string"
        ? JSON.parse(event.data)
        : event.data;

    console.log("Payload from C#:", payload);

    if (!payload.action) return;

    switch (payload.action) {

        
        case 'displayProductDetails':
            renderProductDetails(payload.product);
          case 'displayProductDetails':
    renderProductDetails(payload.product);
    
    // خزن كل المنتجات
    if (payload.allProducts) allProducts = payload.allProducts;

    // Render المنتجات فورًا
    if (allProducts && allProducts.length > 0) {
        renderProducts(allProducts.slice(0, 10), 'best-sellers-container'); // top 10
        // لو عندك container لعرض كل المنتجات تحت:
        const allContainer = document.getElementById('all-products-container');
        if (allContainer) renderProducts(allProducts, 'all-products-container');
    }

    // حدث عداد الكارت فورًا
    if (payload.cartCount !== undefined) updateCartCounter(payload.cartCount);
    break;

            case 'updateProductStock':
    updateStockUI(payload);
    break;

          case 'updateCartCount':
            updateCartCounter(payload.count);
            break;

             case 'homeData':
            handleHomeData(payload.data);
            break;
    }

});
/* ===============================
   Render Product
=================================*/

function updateStockUI(data) {

    // لو ده نفس المنتج المعروض
    if (data.productId !== currentProductId) return;

    const stockEl = document.getElementById("proStock");
    stockEl.innerText = `Stock: ${data.stock}`;

    const addBtn = document.getElementById("cart-add");

    // لو خلص
    if (data.stock <= 0) {
        addBtn.disabled = true;
        addBtn.innerText = "Out of Stock";
        addBtn.style.opacity = "0.6";
        addBtn.style.cursor = "not-allowed";
    } else {
        addBtn.disabled = false;
        addBtn.innerText = "Add to Cart";
        addBtn.style.opacity = "1";
        addBtn.style.cursor = "pointer";
    }
}

function renderProductDetails(p) {
      currentProductId = p.Id;


    // Text
    document.getElementById("proTit").innerText = p.Name ?? "";
    document.getElementById("proDes").innerText = p.Description ?? "";
    document.getElementById("proPri").innerText = `$${p.Price ?? 0}`;
    document.getElementById("proCat").innerText = `Category: ${p.CategoryName ?? "N/A"}`;
    document.getElementById("proStock").innerText = `Stock: ${p.Stock ?? 0}`;

    // Images
    currentImages = [];

    if (p.MainImageUrl) currentImages.push(`./images/${p.MainImageUrl}`);
    if (Array.isArray(p.Images)) p.Images.forEach(img => currentImages.push(`./images/${img}`));

    // Fill to at least 3 images
    while (currentImages.length < 3) currentImages.push(currentImages[0]);

    // Set thumbnails and click events
    for (let i = 0; i < 3; i++) {
        const thumb = document.getElementById(`thumb${i}`);
        thumb.src = currentImages[i];
        thumb.onclick = () => changeImage(i);
    }

    // Show first image
    changeImage(0);
}

/* ===============================
   Change Main Image with Fade
=================================*/
function changeImage(index) {
    const main = document.getElementById("mainImg");

    // Fade out
    main.style.opacity = 0;
    setTimeout(() => {
        main.src = currentImages[index];
        main.style.opacity = 1;
    }, 200);

    // Active thumbnail border
    document.querySelectorAll(".thumbs img").forEach(img => img.classList.remove("active-thumb"));
    document.getElementById(`thumb${index}`).classList.add("active-thumb");
}
</script>

  <script>

function handleHomeData(data) {
    allProducts = data.allProducts || [];

    if (data.cartCount !== undefined) {
        updateCartCounter(data.cartCount);
    }

   
    // ===== Products =====
    renderProducts(data.products || [], 'best-sellers-container');
    
}

// ===============================
// Render Products
// ===============================
function renderProducts(products, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    container.innerHTML = '';

    products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product-card';

        // عند الضغط على المنتج، تحديث الصفحة الحالية بالمنتج نفسه
        div.addEventListener('click', () => {
            window.chrome.webview.postMessage({
                action: 'viewProduct',
                productId: p.Id
            });
            console.log("Sending viewProduct:", p.Id);
                window.scrollTo({ top: 0, behavior: 'smooth' });

        });

        div.innerHTML = `
            <div class="product-image">
                <img src="./images/${p.MainImageUrl}" alt="${p.Name}" class="main-img">
                <img src="./images/${p.HoverImageUrl}" alt="${p.Name}" class="hover-img">
                <div class="product-actions">
                    <button class="add-cart" onclick="event.stopPropagation(); addToCart(${p.Id})">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </button>
                    <button class="view" onclick="event.stopPropagation(); window.chrome.webview.postMessage({ action: 'viewProduct', productId: ${p.Id} })">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <h3>${p.Name}</h3>
            <p>$${p.Price}</p>
            <div class="product-category">${p.CategoryName}</div>
        `;
        container.appendChild(div);
    });
}

// ================================
// تعديل البحث
// ================================
const searchInput = document.getElementById('search-input');
const searchDropdown = document.getElementById('search-dropdown');

searchInput.addEventListener('input', function () {
    const query = searchInput.value.trim().toLowerCase();

    if (!query) {
        searchDropdown.style.display = 'none';
        searchDropdown.innerHTML = '';
        return;
    }

    const filtered = allProducts.filter(p =>
        p.Name.toLowerCase().includes(query)
    );

    searchDropdown.innerHTML = '';
    if (filtered.length === 0) {
        searchDropdown.innerHTML = '<p style="padding:10px;">No products found</p>';
    } else {
        filtered.forEach(p => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';

            item.innerHTML = `
                <img src="./images/${p.MainImageUrl}">
                <div>
                    <div>${p.Name}</div>
                    <div>$${p.Price}</div>
                    <div>${p.CategoryName}</div>
                </div>
            `;

            // حدث عند الضغط لتحديث المنتج الحالي
            item.addEventListener('click', () => {
                window.chrome.webview.postMessage({
                action: 'viewProduct',
                productId: p.Id
            });
                window.scrollTo({ top: 0, behavior: 'smooth' });
                searchDropdown.style.display = 'none';
            });

            searchDropdown.appendChild(item);
        });
    }

    searchDropdown.style.display = 'block';
});
</script>
